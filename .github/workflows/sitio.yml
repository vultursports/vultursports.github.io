name: Actualizar y publicar

on:
  schedule:
    # Partidos siempre desde las 22:00 hora argentina (UTC-3). Horarios en UTC.
    - cron: "*/20 1-5 * * *"   # cada 20 min de 22:00 a 02:59 AR
    - cron: "0 12,19 * * *"    # 09:00 y 16:00 AR
  push:
    branches: [main]
  workflow_dispatch: {}        # botón "Run workflow" para forzar

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sitio
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Instalar navegador (para la LVA)
        if: github.event_name != 'push'
        run: python -m playwright install --with-deps chromium
      - name: Bajar datos de las ligas
        if: github.event_name != 'push'
        env:
          VPUG_EMAIL: ${{ secrets.VPUG_EMAIL }}
          VPUG_PASSWORD: ${{ secrets.VPUG_PASSWORD }}
        run: python sync.py
      - name: Guardar datos
        if: github.event_name != 'push'
        run: |
          git config user.name "vultur-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos
          git diff --cached --quiet || git commit -m "Datos actualizados $(date -u +%Y-%m-%dT%H:%MZ)"
          for intento in 1 2 3; do
            git pull --rebase -X theirs && git push && break
            echo "No se pudo guardar (intento $intento), se reintenta..."; sleep 5
          done
      - name: Generar sitio
        run: python build.py
      - name: Pruebas automáticas (si fallan, no se publica)
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
