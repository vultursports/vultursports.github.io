name: Pruebas de escenarios

# Simulan cambios de las ligas (W.O., tops, jugadores nuevos, temporada nueva, liga caída...) y
# recorren la web en un navegador. Corren cuando cambia el código; no frenan la actualización de datos.
on:
  push:
    branches: [main]
    paths-ignore: ["datos/**"]
  workflow_dispatch: {}

jobs:
  escenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p "prueba_*.py" -v
